name: Fix Max spelling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace MAX with Макс in exported site files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('index.html'),
              Path('index.txt'),
              Path('__next.__PAGE__.txt'),
              Path('__next._full.txt'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('MAX', 'Макс'), encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.txt __next.__PAGE__.txt __next._full.txt
          git commit -m "Use Russian spelling Макс across the site"
          git push
